name: 動かしてみた
description: 動いた・動かなかった、どちらでも。一行で構いません。
labels: ["報告"]
body:
  - type: markdown
    attributes:
      value: |
        **繋いでくれてありがとうございます。**
        今このネットワークにはノードが数台しかないので、あなたが繋いだ
        時点で一角です。うまくいかなかった話のほうが役に立ちます。

  - type: textarea
    id: what
    attributes:
      label: どうなりましたか
      placeholder: |
        例) mainnet に繋いで 2804 まで同期できた。30 分くらい。
        例) 起動はするがピアが見つからない。
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 環境
      placeholder: "Windows 11 / Ubuntu 24.04 / macOS 15 など"

  - type: textarea
    id: log
    attributes:
      label: ログ
      description: 貼れる範囲で。`[同期]` `[検証]` `[警告]` の行があると助かります。
      render: text
