name: "Something is wrong / おかしい"
description: "Crashes, hangs, numbers that do not add up, a broken display. — 落ちる、止まる、数字が合わない、表示が変。"
labels: ["不具合"]
body:
  - type: markdown
    attributes:
      value: |
        **English or Japanese is fine. 英語でも日本語でも構いません。**

        Anything that lets someone steal funds or break the chain goes to
        `contact@oagcoin.org` instead of here
        ([SECURITY.md](https://github.com/Kazuhiro-Tokumoto/Orange/blob/HEAD/SECURITY.md)).

        資金を盗める・鎖を壊せる類のものは、ここではなく
        `contact@oagcoin.org` へお願いします。

  - type: textarea
    id: what
    attributes:
      label: "What happened? / 何が起きましたか"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "What did you expect instead? / どうなるはずだと思いましたか"
      description: "Saying which part of the spec led you to expect that makes it much faster. 仕様書のどこを読んでそう思ったか、まで書けると早いです。"

  - type: textarea
    id: steps
    attributes:
      label: "How to reproduce it / 再現のしかた"
      description: "Leave blank if you do not know. 分からなければ空で構いません。"
      placeholder: |
        1. ...
        2. ...

  - type: textarea
    id: log
    attributes:
      label: "Log / ログ"
      render: text

  - type: input
    id: version
    attributes:
      label: "Which version / どの版か"
      placeholder: "Commit hash, or the output of oag-node --version"
