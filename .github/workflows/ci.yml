name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ツールチェーンは rust-toolchain.toml で固定されている。
      # rustup が自動で該当バージョンを取得する。
      - name: Rust ツールチェーンを用意する
        run: rustup show && cargo --version && cargo clippy --version

      - name: キャッシュ
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: 書式を確認する
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features

      - name: テスト
        run: cargo test --all-features

      - name: ドキュメントを生成する
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  msrv:
    name: MSRV (Cargo.toml の rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cargo.toml から MSRV を読む
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MSRV は $version"

      - name: MSRV のツールチェーンを用意する
        run: |
          rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal
          rustup override set ${{ steps.msrv.outputs.version }}

      - name: MSRV でビルドできることを確認する
        run: cargo check --all-targets --all-features
