name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ツールチェーンは rust-toolchain.toml で固定されている。
      # rustup が自動で該当バージョンを取得する。
      - name: Rust ツールチェーンを用意する
        run: rustup show && cargo --version && cargo clippy --version

      - name: キャッシュ
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: 書式を確認する
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features

      - name: テスト
        run: cargo test --all-features

      - name: ドキュメントを生成する
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  wasm:
    name: ブラウザのウォレット (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ツールチェーンを用意する
        run: rustup show && rustup target add wasm32-unknown-unknown

      - name: キャッシュ
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-${{ hashFiles('**/Cargo.lock') }}

      # 埋め込んである wasm は、原稿から作り直したものと一致していなければ
      # ならない。**古いまま置き去りにされると、直したはずの不具合が
      # ブラウザ側に残る。**
      - name: 組み直して、置いてあるものと比べる
        env:
          RUSTFLAGS: '--cfg getrandom_backend="custom"'
        run: |
          cargo build -p oag-wallet-wasm --target wasm32-unknown-unknown --release
          built=target/wasm32-unknown-unknown/release/oag_wallet_wasm.wasm
          kept=crates/oag-node/assets/wallet.wasm
          if ! cmp -s "$built" "$kept"; then
            echo "::error::crates/oag-node/assets/wallet.wasm が古い。"
            echo "crates/oag-node/assets/README.md の手順で作り直すこと。"
            ls -l "$built" "$kept"
            exit 1
          fi
          echo "一致した ($(stat -c%s "$kept") バイト)"

      # 取り込み (import) が 1 つでもあると、ブラウザ側に糊が要るように
      # なる。**糊を書かずに済んでいることを、ここで確かめ続ける。**
      - name: 取り込みが無いことを確かめる
        run: python3 tools/wasm-imports.py crates/oag-node/assets/wallet.wasm

  msrv:
    name: MSRV (Cargo.toml の rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cargo.toml から MSRV を読む
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MSRV は $version"

      - name: MSRV のツールチェーンを用意する
        run: |
          rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal
          rustup override set ${{ steps.msrv.outputs.version }}

      - name: MSRV でビルドできることを確認する
        run: cargo check --all-targets --all-features

  default-features:
    name: 既定 feature のみ (RandomX 無し)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust ツールチェーンを用意する
        run: rustup show

      # 主ジョブは --all-features で RandomX 込みを検査している。
      # こちらは feature ゲートが正しく、RandomX 無しでも
      # ワークスペース全体がビルドできることを確認する。
      - name: feature 無しでビルドする
        run: cargo check --workspace --all-targets

      - name: feature 無しでテストする
        run: cargo test --workspace
