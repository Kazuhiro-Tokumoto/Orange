[workspace]
resolver = "2"
members = ["crates/oag-primitives", "crates/oag-consensus", "crates/oag-pow", "crates/oag-chain", "crates/oag-store", "crates/oag-mempool", "crates/oag-net"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/Kazuhiro-Tokumoto/Orange"
authors = ["Orange contributors"]

[workspace.dependencies]
oag-primitives = { path = "crates/oag-primitives", version = "0.1.0" }
oag-consensus = { path = "crates/oag-consensus", version = "0.1.0" }
oag-pow = { path = "crates/oag-pow", version = "0.1.0" }
oag-chain = { path = "crates/oag-chain", version = "0.1.0" }
bech32 = "0.12"
blake3 = "1"
hex = "0.4"
secp256k1 = "0.33"
redb = "4"
thiserror = "2"

[profile.release]
# 静かに誤った金額を生成するより異常終了する方が被害が小さい (docs/SPEC.md §3)
overflow-checks = true
debug-assertions = false
lto = "thin"
codegen-units = 1
