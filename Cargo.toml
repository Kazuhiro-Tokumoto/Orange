[workspace]
resolver = "2"
members = ["crates/oag-primitives", "crates/oag-consensus", "crates/oag-pow", "crates/oag-chain", "crates/oag-store", "crates/oag-mempool", "crates/oag-net", "crates/oag-miner", "crates/oag-rpc", "crates/oag-node", "crates/oag-wallet"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/Kazuhiro-Tokumoto/Orange"
authors = ["Orange contributors"]

[workspace.dependencies]
oag-primitives = { path = "crates/oag-primitives", version = "0.1.0" }
oag-consensus = { path = "crates/oag-consensus", version = "0.1.0" }
oag-pow = { path = "crates/oag-pow", version = "0.1.0" }
oag-chain = { path = "crates/oag-chain", version = "0.1.0" }
oag-mempool = { path = "crates/oag-mempool", version = "0.1.0" }
oag-miner = { path = "crates/oag-miner", version = "0.1.0" }
oag-net = { path = "crates/oag-net", version = "0.1.0" }
oag-store = { path = "crates/oag-store", version = "0.1.0" }
oag-rpc = { path = "crates/oag-rpc", version = "0.1.0" }
oag-node = { path = "crates/oag-node", version = "0.1.0" }
bech32 = "0.12"
clap = { version = "4", features = ["derive"] }
blake3 = "1"
hex = "0.4"
secp256k1 = "0.33"
redb = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1"
thiserror = "2"

[profile.release]
# 静かに誤った金額を生成するより異常終了する方が被害が小さい (docs/SPEC.md §3)
overflow-checks = true
debug-assertions = false
lto = "thin"
codegen-units = 1
