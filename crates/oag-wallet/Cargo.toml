[package]
name = "oag-wallet"
description = "Orange (OAG) のウォレット"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "oag_wallet"
path = "src/lib.rs"

[[bin]]
name = "oag-wallet"
path = "src/main.rs"

[dependencies]
clap.workspace = true
oag-consensus.workspace = true
oag-primitives.workspace = true
oag-rpc.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time"] }

[dev-dependencies]
oag-node.workspace = true
